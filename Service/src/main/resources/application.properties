server.port=8084

spring.application.name = rpService

#debug=true

server.servlet.context-path=/CollectService

server.servlet.encoding.charset=UTF-8

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

spring.kafka.bootstrap-servers=192.168.88.101:9092

spring.kafka.consumer.group-id=datacoll

deepseek.api.url=https://api.deepseek.com/v1/chat/completions

# API key 从环境变量注入（Windows: setx DEEPSEEK_API_KEY "sk-xxx"），不要提交真实 key
deepseek.api.key=${DEEPSEEK_API_KEY:}

deepseek.model=deepseek-chat
