# Flume 配置 - 适配 node1 环境
# 作用：从 Kafka 读取数据，写入 HDFS

hadoop.sources = s1
hadoop.channels = c1
hadoop.sinks = k1

# ====================== Kafka Source ======================
hadoop.sources.s1.type = org.apache.flume.source.kafka.KafkaSource
hadoop.sources.s1.kafka.bootstrap.servers = node1:9092
hadoop.sources.s1.kafka.topics = test
hadoop.sources.s1.kafka.consumer.group.id = ty1
hadoop.sources.s1.kafka.consumer.auto.offset.reset = earliest
hadoop.sources.s1.channels = c1

# 时间戳拦截器，给 event header 加 timestamp，HDFS 路径才能用 %Y-%m-%d 等占位符
hadoop.sources.s1.interceptors = i1
hadoop.sources.s1.interceptors.i1.type = timestamp

# ====================== Memory Channel ======================
hadoop.channels.c1.type = memory
hadoop.channels.c1.capacity = 1000
hadoop.channels.c1.transactionCapacity = 1000

# ====================== HDFS Sink ======================
hadoop.sinks.k1.type = hdfs
hadoop.sinks.k1.channel = c1
hadoop.sinks.k1.hdfs.path = /data/kafka/te/%Y-%m-%d/%H
hadoop.sinks.k1.hdfs.fileType = DataStream
hadoop.sinks.k1.hdfs.writeFormat = Text
hadoop.sinks.k1.hdfs.rollSize = 0
hadoop.sinks.k1.hdfs.rollCount = 0
hadoop.sinks.k1.hdfs.rollInterval = 30
hadoop.sinks.k1.hdfs.useLocalTimeStamp = true
